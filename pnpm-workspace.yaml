packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@parcel/watcher": true
  "@scarf/scarf": false
  bcrypt: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
  - lucide-react@1.62.0
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
