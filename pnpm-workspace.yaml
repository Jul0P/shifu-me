packages:
  - "apps/*"
  - "packages/*"
saveExact: true
allowBuilds:
  "@swc/core": true
  unrs-resolver: false
  esbuild: true
  "@parcel/watcher": true
  "@scarf/scarf": false
  bcrypt: true
minimumReleaseAgeExclude:
  - lucide-react@1.62.0
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
